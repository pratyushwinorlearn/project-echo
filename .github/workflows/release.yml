
name: Build and Release Project Echo

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            artifact_paths: |
              release/*.exe
              release/*.blockmap

          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_paths: |
              release/*.AppImage
              release/*.deb

          - os: macos-26
            platform: macos
            arch: arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip

          - os: macos-26-intel
            platform: macos
            arch: x64
            artifact_paths: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Electron source
        run: npm run check:electron

      - name: Build React application
        run: npm run build

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64

      - name: Package Linux installers
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb --x64

      - name: Package macOS installers
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-Echo-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release

    needs: build

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
