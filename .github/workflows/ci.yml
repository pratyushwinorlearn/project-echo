name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Electron JavaScript syntax
        run: npm run check:electron

      - name: Check knowledge and provider modules
        run: |
          node --check electron/knowledge/bm25Engine.cjs
          node --check electron/knowledge/documentChunker.cjs
          node --check electron/knowledge/documentExtractor.cjs
          node --check electron/knowledge/documentManager.cjs
          node --check electron/knowledge/knowledgeController.cjs
          node --check electron/ai/providerRegistry.cjs
          node --check electron/ai/providers/openaiCompatible.cjs
          node --check electron/ai/providers/anthropic.cjs

      - name: Build renderer
        run: npm run build
